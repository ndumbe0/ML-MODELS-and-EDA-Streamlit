# Application configuration
# Credentials are loaded from environment variables, not stored here.
# See .env.example for required variables.

credentials:
  # Userstore: define usernames here, passwords come from env vars
  usernames:
    jsmith:
      email: jsmith@example.com
      name: John Smith
      password_hash_env: JSMITH_PASSWORD_HASH  # Read from environment

cookie:
  expiry_days: 30
  key_env: COOKIE_SIGNATURE_KEY  # Read from environment
  name: telco_churn_app

preauthorized:
  emails:
    - melsby@example.com
